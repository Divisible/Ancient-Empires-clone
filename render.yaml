services:
  - type: web
    name: knyaz-realms
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/knyaz-data
